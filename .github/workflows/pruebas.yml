# Las pruebas corren solas en cada push (11-oct, Leider: "bajemos a 10 min").
# Antes la laptop era el servidor de pruebas: 22 min de suite en serie por
# cada cambio, antes de poder tocar master. Aqui corren en paralelo y aparte;
# el despliegue a la VM va con los tests del modulo tocado, y master se
# empuja cuando esto da verde.
name: pruebas

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest pytest-xdist pytest-rerunfailures
      # Un proceso por nucleo: la base de cada test es SQLite en memoria y
      # los usuarios de prueba van a un directorio temporal, asi que no se pisan.
      # Si un arranque se cruza con otro (SQLite y "table already exists"),
      # se repite esa prueba una vez: es carrera del arranque, no un fallo.
      - run: python -m pytest -q -p no:warnings -n auto --reruns 1 --only-rerun "already exists"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npx vitest run
