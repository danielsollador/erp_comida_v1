# nginx hace de puerta unica: sirve el SPA compilado y reenvia /api y /ws al
# backend. Front y API comparten origen -> sin CORS y sin URLs hardcodeadas.

upstream erp_backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No anunciar la version de nginx en las respuestas.
    server_tokens off;

    # Cabeceras de seguridad basicas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Los respaldos que se descargan pueden pesar; no cortar la respuesta.
    client_max_body_size 25m;
    proxy_read_timeout 120s;

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Assets con hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://erp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # WebSocket para la pantalla de cocina / POS en tiempo real.
    location /ws {
        proxy_pass http://erp_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # SPA: cualquier ruta de react-router cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca se cachea: asi un deploy nuevo se ve al recargar.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
