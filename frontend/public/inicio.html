<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Vertigo Pro</title>
<!--
  La pantalla del HUB (vertigopro.tech).

  Para Vertigo es la cartera: todos los locales, si estan vivos, quien tiene
  acceso a cada uno, y la administracion de cuentas. Para un dueño con varios
  locales es elegir a cual entrar. Quien tiene UN local nunca llega aqui: el
  login lo manda directo con un pase.

  HTML plano, sin el paquete de React: nginx solo lo sirve con sesion, pero
  aun asi no arrastra nada del ERP.
-->
<style>
  /* Los mismos tokens del sistema de diseño del ERP (src/index.css). */
  :root {
    --tinta: #17181b; --tinta-suave: #3e3d3a; --apagado: #6d6b66; --tenue: #98948b;
    --linea: #e2ded5; --fondo: #f6f4ef; --sup: #ffffff; --acento: #17181b;
    --acento-txt: #ffffff; --ok: #15803d; --ok-lav: #dcfce7; --mal: #b91c1c;
    --mal-lav: #fee2e2; --ojo: #a16207; --ojo-lav: #fef3c7; --foco: rgba(23,24,27,.22);
    --textura: rgba(23,24,27,.05);
  }
  html[data-tema="oscuro"] {
    --tinta: #f1f3f7; --tinta-suave: #d1d5dd; --apagado: #a1a7b4; --tenue: #7c8290;
    --linea: #262a33; --fondo: #0e1014; --sup: #161920; --acento: #e3e6ec;
    --acento-txt: #0e0f12; --ok: #86efac; --ok-lav: #14321f; --mal: #fca5a5;
    --mal-lav: #3a1414; --ojo: #fcd34d; --ojo-lav: #3a2c0a; --foco: rgba(227,230,236,.25);
    --textura: rgba(255,255,255,.045);
  }
  html { color-scheme: light; }
  html[data-tema="oscuro"] { color-scheme: dark; }
  ::view-transition-old(root) { animation: none; mix-blend-mode: normal; }
  ::view-transition-new(root) { animation: vp-revelar .52s cubic-bezier(.2,.7,.2,1); mix-blend-mode: normal; }
  @keyframes vp-revelar {
    from { clip-path: circle(0px at var(--vp-x, 50%) var(--vp-y, 50%)); }
    to { clip-path: circle(var(--vp-radio, 160vmax) at var(--vp-x, 50%) var(--vp-y, 50%)); }
  }
  @media (prefers-reduced-motion: reduce) {
    ::view-transition-old(root), ::view-transition-new(root) { animation: none; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--fondo); color: var(--tinta);
    font-family: "Manrope", ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(60rem 36rem at -10% -20%, color-mix(in oklab, var(--acento) 13%, transparent), transparent 60%),
      radial-gradient(var(--textura) .8px, transparent .8px);
    background-size: auto, 22px 22px;
    background-attachment: fixed;
  }
  h1, h2, .local .nombre { font-family: "Sora", "Manrope", sans-serif; }
  header {
    display: flex; align-items: center; gap: 10px; padding: 14px 20px;
    border-bottom: 1px solid var(--linea); background: var(--sup); position: sticky; top: 0; z-index: 5;
  }
  .marca {
    display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase; color: var(--apagado);
  }
  .marca .punto { width: 9px; height: 9px; border-radius: 3px; background: var(--acento); transform: rotate(45deg); }
  .quien { margin-left: auto; font-size: 13px; color: var(--apagado); }
  .quien b { color: var(--tinta); font-weight: 600; }
  button, .btn {
    font: inherit; font-size: 13px; padding: 8px 12px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--linea); background: transparent; color: var(--tinta);
  }
  button:hover, .btn:hover { border-color: var(--apagado); }
  button.primario { background: var(--acento); color: var(--acento-txt); border-color: var(--acento); font-weight: 600; }
  button.primario:hover { opacity: .9; }
  button.peligro { color: var(--mal); }
  button:disabled { opacity: .5; cursor: default; }
  .tema { width: 34px; height: 34px; padding: 0; display: grid; place-items: center; border-radius: 999px; color: var(--tenue); }
  .tema svg { width: 15px; height: 15px; }
  main { max-width: 960px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: -.02em; margin: 0 0 4px; }
  h2 { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
  .sub { color: var(--apagado); margin: 0 0 22px; font-size: 14px; }
  .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .local {
    display: flex; flex-direction: column; gap: 6px; padding: 18px 20px; border-radius: 18px;
    background: var(--sup); border: 1px solid var(--linea); color: inherit; text-decoration: none;
    transition: transform .12s ease, box-shadow .12s ease; position: relative;
  }
  a.local:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.08); }
  .local .cab { display: flex; align-items: center; gap: 10px; }
  .local img { height: 28px; width: auto; max-width: 140px; object-fit: contain; }
  html[data-tema="oscuro"] .local img { filter: brightness(1.9) saturate(.85) contrast(1.05); }
  .local .nombre { font-size: 18px; font-weight: 600; }
  .local .desc { font-size: 13px; color: var(--apagado); }
  .local .pie { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 12px; color: var(--apagado); }
  .estado { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
  .estado::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .estado.ok { color: var(--ok); background: var(--ok-lav); }
  .estado.mal { color: var(--mal); background: var(--mal-lav); }
  .estado.ojo { color: var(--ojo); background: var(--ojo-lav); }
  .vacio { padding: 28px; border-radius: 18px; border: 1px dashed var(--linea); color: var(--apagado); text-align: center; }
  .seccion { margin-top: 36px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; border-bottom: 1px solid var(--linea); }
  .tabs button { border: none; border-radius: 0; padding: 10px 14px; color: var(--apagado); border-bottom: 2px solid transparent; }
  .tabs button.activa { color: var(--tinta); border-bottom-color: var(--acento); font-weight: 600; }
  .tarjeta { background: var(--sup); border: 1px solid var(--linea); border-radius: 18px; padding: 18px 20px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--apagado); padding: 8px 10px; border-bottom: 1px solid var(--linea); }
  td { padding: 10px; border-bottom: 1px solid var(--linea); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  select, input {
    font: inherit; font-size: 13px; padding: 7px 10px; border-radius: 10px;
    border: 1px solid var(--linea); background: var(--sup); color: var(--tinta);
  }
  select:focus, input:focus { outline: none; border-color: var(--acento); box-shadow: 0 0 0 3px var(--foco); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--linea); cursor: pointer; user-select: none; }
  .chip input { margin: 0; }
  .chip.on { background: var(--acento); color: var(--acento-txt); border-color: var(--acento); }
  .pastilla { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--fondo); border: 1px solid var(--linea); color: var(--tinta-suave); }
  .acciones { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .acciones button { padding: 6px 10px; font-size: 12px; }
  .form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; align-items: end; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--linea); }
  .form label { display: flex; flex-direction: column; gap: 5px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--apagado); font-weight: 600; }
  .form .ancho { grid-column: 1 / -1; }
  .aviso { margin: 12px 0; padding: 10px 12px; border-radius: 10px; font-size: 13px; display: none; }
  .aviso.visible { display: block; }
  .aviso.bien { color: var(--ok); background: var(--ok-lav); }
  .aviso.mal { color: var(--mal); background: var(--mal-lav); }
  .muted { color: var(--apagado); font-size: 12px; }
  /* Gastos de Vertigo */
  .cifras { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
  .cifra { padding: 14px 16px; border-radius: 14px; background: var(--fondo); border: 1px solid var(--linea); }
  .cifra .rotulo { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--apagado); font-weight: 600; }
  .cifra .valor { font-family: "Sora", "Manrope", sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .cifra .valor small { font-size: 12px; font-weight: 600; color: var(--apagado); margin-left: 3px; }
  .cifra .extra { font-size: 12px; color: var(--apagado); margin-top: 2px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.apagado td { opacity: .55; }
  tr.historial td { background: var(--fondo); padding: 8px 10px 12px 22px; }
  .historial ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .historial li { display: flex; gap: 10px; align-items: center; }
  .historial li button { padding: 3px 8px; font-size: 11px; }
  .enlace { border: none; padding: 0; background: none; color: var(--apagado); font-size: 12px; text-decoration: underline; text-underline-offset: 2px; }
  .form textarea { font: inherit; font-size: 13px; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--linea); background: var(--sup); color: var(--tinta); resize: vertical; min-height: 38px; }
  .desliza { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
  .solo-movil, .solo-movil-txt { display: none; }
  .gastos .estado { white-space: nowrap; }
  .filtros { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .filtros .chip { padding: 6px 12px; font-size: 12px; }
  .filtros .chip .cuenta { font-size: 11px; font-weight: 700; opacity: .7; margin-left: 2px; }
  .gastos td .acciones { flex-wrap: nowrap; }
  @media (max-width: 760px) { .cifras { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px) {
    .tarjeta.gastos { padding: 14px 12px; }
    .gastos td, .gastos th { padding: 8px 6px; }
    .gastos .cifra { padding: 12px; }
    .gastos .cifra .valor { font-size: 18px; }
    .gastos .solo-movil { display: flex; justify-content: flex-start; margin-top: 8px; }
    .gastos .solo-movil-txt { display: block; }
  }
  @media (max-width: 640px) { .oculto-movil { display: none; } }
</style>
<script>
  (function () {
    try {
      var t = localStorage.getItem("vertigo_tema");
      if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "oscuro" : "claro";
      document.documentElement.dataset.tema = t;
    } catch (e) { document.documentElement.dataset.tema = "claro"; }
  })();
</script>
</head>
<body>
  <header>
    <div class="marca"><span class="punto"></span> Vertigo Pro</div>
    <div class="quien" id="quien"></div>
    <button class="tema" id="tema" type="button" aria-label="Cambiar entre modo claro y oscuro"></button>
    <button id="salir" type="button">Salir</button>
  </header>
  <main>
    <h1 id="titulo">Locales</h1>
    <p class="sub" id="sub">Elige a cual entrar.</p>
    <div class="rejilla" id="rejilla"></div>

    <section class="seccion" id="admin" hidden>
      <h2>Administración</h2>
      <div class="tabs">
        <button type="button" data-tab="usuarios" class="activa">Cuentas</button>
        <button type="button" data-tab="locales">Locales</button>
        <button type="button" data-tab="gastos">Gastos</button>
      </div>
      <div class="aviso" id="aviso" role="status"></div>
      <div class="tarjeta" id="panel"></div>
    </section>
  </main>

<script>
(function () {
  var raiz = document.documentElement;
  var rejilla = document.getElementById("rejilla");
  var sub = document.getElementById("sub");
  var admin = document.getElementById("admin");
  var panel = document.getElementById("panel");
  var aviso = document.getElementById("aviso");

  // ---------- tema ----------
  var SOL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>';
  var LUNA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.6 8.6 0 1 1 9.8 3.5a6.9 6.9 0 0 0 10.7 10.7z"/></svg>';
  var btnTema = document.getElementById("tema");
  function pintarBoton() { btnTema.innerHTML = raiz.dataset.tema === "oscuro" ? SOL : LUNA; }
  pintarBoton();
  btnTema.addEventListener("click", function () {
    var nuevo = raiz.dataset.tema === "oscuro" ? "claro" : "oscuro";
    var aplicar = function () {
      raiz.dataset.tema = nuevo;
      try { localStorage.setItem("vertigo_tema", nuevo); } catch (e) {}
      pintarBoton();
      if (typeof dibujarAdmin === "function" && !admin.hidden) dibujarAdmin();
    };
    if (document.startViewTransition && !(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches)) {
      var r = btnTema.getBoundingClientRect();
      var x = r.left + r.width / 2, y = r.top + r.height / 2;
      var radio = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
      raiz.style.setProperty("--vp-x", x + "px");
      raiz.style.setProperty("--vp-y", y + "px");
      raiz.style.setProperty("--vp-radio", Math.ceil(radio) + "px");
      document.startViewTransition(aplicar);
    } else {
      aplicar();
    }
  });

  document.getElementById("salir").addEventListener("click", function () {
    fetch("/api/acceso/logout", { method: "POST", credentials: "same-origin" })
      .then(function () { window.location.replace("/login.html"); })
      .catch(function () { window.location.replace("/login.html"); });
  });

  // ---------- utilidades ----------
  function esc(t) { var d = document.createElement("div"); d.textContent = t == null ? "" : String(t); return d.innerHTML; }
  function pedir(url, opts) {
    opts = opts || {};
    opts.credentials = "same-origin";
    if (opts.body && !opts.headers) opts.headers = { "Content-Type": "application/json" };
    return fetch(url, opts).then(function (r) {
      if (r.status === 401) { window.location.replace("/login.html"); throw new Error("Sesión requerida."); }
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok) throw new Error((d && d.detail) || ("Error " + r.status));
        return d;
      });
    });
  }
  function mostrar(texto, bien) {
    aviso.textContent = texto;
    aviso.className = "aviso visible " + (bien ? "bien" : "mal");
    clearTimeout(mostrar._t);
    mostrar._t = setTimeout(function () { aviso.className = "aviso"; }, 4000);
  }
  var NOMBRE_ROL = { admin: "Vertigo", dueno: "Dueño", caja: "Caja", cocina: "Cocina" };

  // A donde lleva la tarjeta. Hay DOS direcciones por local: desarrollo
  // (localhost) y produccion (el subdominio). Se elige por donde se este viendo
  // ESTA pantalla, asi la misma imagen sirve en los dos sitios.
  function destino(m) {
    var local = location.hostname === "localhost" || location.hostname === "127.0.0.1" || location.hostname === "[::1]";
    return (local ? m.url : (m.dominio || m.url)) || "";
  }

  // Ir a un local SIN volver a poner la clave: se pide un pase para ese local y
  // el ERP de destino lo canjea por su propia cookie. Dura un minuto y se gasta
  // una vez. Si algo falla se va igual, sin pase: alli habra un login.
  function irA(m, ev) {
    var url = destino(m);
    if (!url) return;
    if (ev) ev.preventDefault();
    pedir("/api/acceso/pase", { method: "POST", body: JSON.stringify({ local: m.slug }) })
      .then(function (d) { location.href = url.replace(/\/$/, "") + "/api/acceso/entrar?pase=" + encodeURIComponent(d.pase); })
      .catch(function () { location.href = url; });
  }

  function tarjeta(m, cartera) {
    var a = document.createElement("a");
    a.className = "local";
    var ir = destino(m);
    a.href = ir || "#";
    var cab = m.logo
      ? '<img src="' + esc(m.logo) + '" alt="' + esc(m.nombre) + '">'
      : '<span class="nombre">' + esc(m.nombre) + '</span>';
    var pie = '<span>' + esc(ir.replace(/^https?:\/\//, "")) + '</span>';
    if (cartera) {
      var s = cartera.salud || {};
      var clase = s.estado === "ok" ? "ok" : (s.estado === "caido" || s.estado === "error" ? "mal" : "ojo");
      var texto = s.estado === "ok" ? "en linea" : (s.estado === "caido" ? "caido" : (s.estado === "error" ? "con error" : "sin revisar"));
      pie += '<span class="estado ' + clase + '" title="' + esc(s.detalle || "") + '">' + texto + '</span>';
    }
    a.innerHTML = '<div class="cab">' + cab + '</div>'
      + '<span class="desc">' + esc(m.descripcion || "") + '</span>'
      + (cartera ? '<span class="muted">' + cartera.usuarios + ' cuenta' + (cartera.usuarios === 1 ? "" : "s")
          + (cartera.duenos && cartera.duenos.length ? ' · dueño: ' + esc(cartera.duenos.join(", ")) : "") + '</span>' : "")
      + '<div class="pie">' + pie + '</div>';
    if (ir) a.addEventListener("click", function (ev) {
      if (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button !== 0) return;
      irA(m, ev);
    });
    return a;
  }

  // ---------- administracion (solo Vertigo) ----------
  var TAB = "usuarios";
  var LOCALES = [];
  document.querySelectorAll(".tabs button").forEach(function (b) {
    b.addEventListener("click", function () {
      TAB = b.dataset.tab;
      document.querySelectorAll(".tabs button").forEach(function (x) { x.classList.toggle("activa", x === b); });
      location.hash = "admin/" + TAB;
      dibujarAdmin();
    });
  });

  function dibujarAdmin() {
    panel.innerHTML = '<span class="muted">Cargando…</span>';
    panel.classList.remove("gastos");
    if (TAB === "locales") return dibujarLocales();
    if (TAB === "gastos") return dibujarGastos();
    return dibujarUsuarios();
  }

  // ---------- gastos de Vertigo ----------
  // Lo que cuesta mantener la plataforma. Los totales vienen por moneda y no
  // se convierten: la tasa es cosa de cada local, no del hub.
  var FRECUENCIA = { mensual: "al mes", trimestral: "cada 3 meses", semestral: "cada 6 meses", anual: "al año", unico: "una vez", a_demanda: "por consumo" };
  // Que clase de costo es: lo que llega solo cada tanto, lo que se paga una
  // vez, o lo que se paga cuando se gasta (credito prepago, sin fecha).
  var CADA = { mensual: "cada mes", trimestral: "cada 3 meses", semestral: "cada 6 meses", anual: "cada año" };
  function tipo(g) {
    if (CADA[g.frecuencia]) return '<b>Recurrente</b><div class="muted">' + CADA[g.frecuencia] + '</div>';
    if (g.frecuencia === "unico") return '<b>Único</b><div class="muted">se paga una vez</div>';
    return '<b>Por consumo</b><div class="muted">sin fecha fija</div>';
  }
  var ESTADO_GASTO = {
    activo: ["Activo", "ok"], por_contratar: ["Por contratar", "ojo"],
    por_cancelar: ["Por cancelar", "mal"], cancelado: ["Cancelado", ""]
  };
  var SIMBOLO = { USD: "US$", EUR: "€", VES: "Bs" };
  var EDITANDO = null;      // id del gasto que esta en el formulario, o null
  var FILTRO_PAGO = "todos"; // todos | por_pagar | pagado (este mes)
  var FILTRO_CAT = "";       // "" = todas
  var ABIERTOS = {};        // historiales desplegados, por id

  function dinero(v, moneda) {
    return (SIMBOLO[moneda] || moneda) + " " + Number(v).toLocaleString("es-VE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  // {USD: 12, EUR: 6} -> "US$ 12,00 · € 6,00". La primera moneda va grande.
  function porMoneda(d) {
    var claves = Object.keys(d || {});
    if (!claves.length) return { grande: "—", resto: "" };
    claves.sort(function (a, b) { return a === "USD" ? -1 : b === "USD" ? 1 : 0; });
    return {
      grande: esc(Number(d[claves[0]]).toLocaleString("es-VE", { minimumFractionDigits: 2, maximumFractionDigits: 2 })) + '<small>' + esc(SIMBOLO[claves[0]] || claves[0]) + '</small>',
      resto: claves.slice(1).map(function (k) { return esc(dinero(d[k], k)); }).join(" · ")
    };
  }
  function dias(desde, hasta) {
    return Math.round((Date.parse(hasta + "T00:00:00") - Date.parse(desde + "T00:00:00")) / 86400000);
  }
  function fechaCorta(iso) {
    return new Date(iso + "T00:00:00").toLocaleDateString("es-VE", { day: "2-digit", month: "short", year: "numeric" });
  }
  function cuando(g, hoy) {
    if (g.estado === "cancelado") return '<span class="muted">—</span>';
    if (!g.proximo_pago) return '<span class="muted">' + (g.frecuencia === "a_demanda" ? "cuando se acabe"
      : g.frecuencia === "unico" && g.pagos.length ? "pagado" : "sin fecha") + '</span>';
    var n = dias(hoy, g.proximo_pago);
    var txt = n < 0 ? "vencido hace " + (-n) + (n === -1 ? " día" : " días") : n === 0 ? "hoy" : n === 1 ? "mañana" : "en " + n + " días";
    var clase = n < 0 ? "mal" : n <= 7 ? "ojo" : "";
    return esc(fechaCorta(g.proximo_pago)) + '<div>' + (clase ? '<span class="estado ' + clase + '">' + txt + '</span>' : '<span class="muted">' + txt + '</span>') + '</div>';
  }

  function cifra(rotulo, partes, extra) {
    return '<div class="cifra"><div class="rotulo">' + rotulo + '</div><div class="valor">' + partes.grande + '</div>'
      + '<div class="extra">' + (partes.resto ? partes.resto + (extra ? " · " : "") : "") + (extra || "") + '</div></div>';
  }

  function dibujarGastos() {
    pedir("/api/gastos-vertigo").then(function (d) {
      var r = d.resumen, op = d.opciones, hoy = d.hoy;

      var mes = new Date(hoy + "T00:00:00").toLocaleDateString("es-VE", { month: "long" });

      var nPagado = d.gastos.filter(function (g) { return g.pagado_mes; }).length;
      var anual = porMoneda(r.pagado_anio);
      var cifras = '<div class="cifras">'
        + cifra("Fijo al mes", porMoneda(r.mensual), "solo los recurrentes")
        + cifra("Fijo al año", porMoneda(r.anual), r.activos + " gasto" + (r.activos === 1 ? "" : "s") + " activo" + (r.activos === 1 ? "" : "s"))
        + cifra("Por pagar en " + mes, porMoneda(r.por_pagar_mes), nPorPagar + " pago" + (nPorPagar === 1 ? "" : "s") + ", vencidos incluidos")
        + cifra("Pagado en " + mes, porMoneda(r.pagado_mes), "en " + anio + ": " + (anual.grande === "—" ? "—" : anual.grande.replace(/<[^>]+>/g, " ")))

      // Las categorias que de verdad se usan, no la lista entera.
      var usadas = op.categorias.filter(function (c) { return d.gastos.some(function (g) { return g.categoria === c; }); });
      if (FILTRO_CAT && usadas.indexOf(FILTRO_CAT) === -1) FILTRO_CAT = "";
      var visibles = d.gastos.filter(function (g) {

      });
      var boton = function (valor, texto, n) {
        return '<button type="button" class="chip' + (FILTRO_PAGO === valor ? " on" : "") + '" data-filtro-pago="' + valor + '">'

        + '<select data-filtro-cat aria-label="Categoría"><option value="">Todas las categorías</option>'
        + usadas.map(function (c) { return '<option' + (c === FILTRO_CAT ? " selected" : "") + '>' + esc(c) + '</option>'; }).join("")
        + '</select></div>';

      var filas = visibles.map(function (g) {
        var est = ESTADO_GASTO[g.estado] || [g.estado, ""];
        var pill = est[1] ? '<span class="estado ' + est[1] + '">' + est[0] + '</span>' : '<span class="pastilla">' + est[0] + '</span>';
        var botones = (g.estado !== "cancelado" ? '<button type="button" data-pagar>Pagado</button>' : "")
          + '<button type="button" data-editar>Editar</button>';
        // Solo se pide el monto de lo que sigue: lo que se va a cancelar no.
        var monto = g.monto == null ? (g.estado === "activo" ? '<span class="estado ojo">falta el monto</span>' : '<span class="muted">sin monto</span>')
          : g.monto === 0 ? '<b>Gratis</b>' : '<b>' + esc(dinero(g.monto, g.moneda)) + '</b>';
        var fila = '<tr data-g="' + g.id + '"' + (g.estado === "cancelado" ? ' class="apagado"' : "") + '>'
          + '<td><b>' + esc(g.nombre) + '</b><div class="muted">' + esc([g.proveedor, g.categoria].filter(Boolean).join(" · "))
          + (g.paga ? " · paga " + esc(g.paga) : "") + '</div>'
          + (g.nota ? '<div class="muted" style="margin-top:2px">' + esc(g.nota) + '</div>' : "")
          + (g.pagos.length ? '<button type="button" class="enlace" data-historial>' + g.pagos.length + ' pago' + (g.pagos.length === 1 ? "" : "s") + ' anotado' + (g.pagos.length === 1 ? "" : "s") + '</button>' : "")
          + '<div class="acciones solo-movil">' + botones + '</div>'
          + '</td>'
          + '<td class="num">' + monto + '<div class="muted solo-movil-txt">' + esc(FRECUENCIA[g.frecuencia] || g.frecuencia) + '</div></td>'
          + '<td class="oculto-movil">' + tipo(g) + '</td>'
          + '<td>' + cuando(g, hoy) + '</td>'
          + '<td class="oculto-movil">' + pill + '</td>'
          + '<td class="oculto-movil"><div class="acciones">' + botones + '</div></td>'
          + '</tr>';
        if (ABIERTOS[g.id] && g.pagos.length) {
          fila += '<tr class="historial" data-de="' + g.id + '"><td colspan="6"><ul>' + g.pagos.slice().reverse().map(function (p) {
            return '<li><span>' + esc(fechaCorta(p.fecha)) + '</span><b>' + esc(dinero(p.monto, g.moneda)) + '</b>'
              + (p.registrado_por ? '<span class="muted">' + esc(p.registrado_por) + '</span>' : "")
              + '<button type="button" class="peligro" data-anular="' + p.id + '">Anular</button></li>';
          }).join("") + '</ul></td></tr>';
        }
        return fila;
      }).join("");

      var g = EDITANDO != null ? d.gastos.filter(function (x) { return x.id === EDITANDO; })[0] : null;
      if (EDITANDO != null && !g) EDITANDO = null;
      var v = g || { nombre: "", proveedor: "", categoria: "Infraestructura", monto: null, moneda: "USD", frecuencia: "mensual", proximo_pago: null, paga: "", estado: "activo", nota: "" };
      var opciones = function (lista, actual, nombres) {
        return lista.map(function (x) { return '<option value="' + esc(x) + '"' + (x === actual ? " selected" : "") + '>' + esc(nombres ? (nombres[x] || x) : x) + '</option>'; }).join("");
      };
      var nombresEstado = {};
      Object.keys(ESTADO_GASTO).forEach(function (k) { nombresEstado[k] = ESTADO_GASTO[k][0]; });
      var nombresFrec = { mensual: "Mensual", trimestral: "Trimestral", semestral: "Semestral", anual: "Anual", unico: "Pago único", a_demanda: "Por consumo (sin fecha fija)" };

      panel.classList.add("gastos");

      panel.innerHTML = cifras + filtros
        + '<div class="desliza"><table><thead><tr><th>Gasto</th><th class="num">Monto</th><th class="oculto-movil">Tipo</th><th>Próximo pago</th><th class="oculto-movil">Estado</th><th class="oculto-movil"></th></tr></thead><tbody>'
        + (filas || '<tr><td colspan="6" class="muted">' + vacio + '</td></tr>') + '</tbody></table></div>'
        + '<form class="form" id="gasto">'
        + '<div class="ancho"><h2 style="margin:0">' + (g ? "Editar «" + esc(g.nombre) + "»" : "Nuevo gasto") + '</h2></div>'
        + '<label>Gasto<input name="nombre" required minlength="2" maxlength="80" value="' + esc(v.nombre) + '" placeholder="ej. Servidor de producción"></label>'
        + '<label>Proveedor<input name="proveedor" maxlength="60" value="' + esc(v.proveedor) + '" placeholder="ej. Google Cloud"></label>'
        + '<label>Categoría<select name="categoria">' + opciones(op.categorias, v.categoria) + '</select></label>'
        + '<label>Monto<input name="monto" type="number" min="0" step="0.01" inputmode="decimal" value="' + (v.monto == null ? "" : esc(v.monto)) + '" placeholder="vacío si no se sabe"></label>'
        + '<label>Moneda<select name="moneda">' + opciones(op.monedas, v.moneda, SIMBOLO) + '</select></label>'
        + '<label>Se paga<select name="frecuencia">' + opciones(op.frecuencias, v.frecuencia, nombresFrec) + '</select></label>'
        + '<label>Próximo pago<input name="proximo_pago" type="date" value="' + esc(v.proximo_pago || "") + '"></label>'
        + '<label>Quién lo paga<input name="paga" maxlength="40" value="' + esc(v.paga) + '" placeholder="ej. Leider"></label>'
        + '<label>Estado<select name="estado">' + opciones(op.estados, v.estado, nombresEstado) + '</select></label>'
        + '<label class="ancho">Nota<textarea name="nota" maxlength="300" rows="2">' + esc(v.nota) + '</textarea></label>'
        + '<div class="ancho acciones" style="justify-content:flex-start">'

      panel.querySelectorAll("[data-filtro-pago]").forEach(function (b) {

      panel.querySelector("[data-filtro-cat]").addEventListener("change", function (ev) { FILTRO_CAT = ev.target.value; dibujarGastos(); });

      panel.querySelectorAll("tr[data-g]").forEach(function (tr) {

        // Los botones van dos veces (al lado en PC, bajo el nombre en el
        // telefono): se cablean todos.
        tr.querySelectorAll("[data-pagar]").forEach(function (b) { b.addEventListener("click", pagar); });
        tr.querySelectorAll("[data-editar]").forEach(function (b) { b.addEventListener("click", editar); });
        function pagar() {
          var monto = gasto.monto;
          var texto = window.prompt("¿Cuánto se pagó de «" + gasto.nombre + "»? (" + (SIMBOLO[gasto.moneda] || gasto.moneda) + ")", monto == null ? "" : String(monto));
          if (texto === null) return;
          var valor = Number(String(texto).replace(",", "."));
          if (!texto.trim() || isNaN(valor) || valor < 0) { mostrar("Escribe un monto válido.", false); return; }
          pedir("/api/gastos-vertigo/" + id + "/pago", { method: "POST", body: JSON.stringify({ monto: valor }) })
            .then(function () { mostrar("Pago de «" + gasto.nombre + "» anotado.", true); dibujarGastos(); })
            .catch(function (e) { mostrar(e.message, false); });

      panel.querySelectorAll("tr.historial [data-anular]").forEach(function (b) {

      var on = elegidos.indexOf(m.slug) !== -1;

      panel.innerHTML = '<table><thead><tr><th>Cuenta</th><th>Rol</th><th>Locales</th><th></th></tr></thead><tbody>'

          .catch(function (e) { mostrar(e.message, false); });

  }

  // ---------- arranque ----------
  fetch("/api/acceso/estado", { credentials: "same-origin" })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d || !d.autenticado) { window.location.replace("/login.html"); return; }
      document.getElementById("quien").innerHTML = "<b>" + esc(d.usuario) + "</b> · " + esc(NOMBRE_ROL[d.rol] || d.rol);
      var locales = d.locales || [];
      var vertigo = d.puede && d.puede.vertigo;

      if (!vertigo) {
        // Un dueño con varios locales: elige. Con uno solo, directo.
        if (locales.length === 1 && destino(locales[0])) { irA(locales[0]); return; }
        if (!locales.length) {
          rejilla.innerHTML = '<div class="vacio">Tu usuario no tiene ningun local asignado. Pidele a Vertigo que te asigne uno.</div>';
          sub.textContent = "Sin locales asignados";
          return;
        }
        sub.textContent = locales.length + " locales";
        locales.forEach(function (m) { rejilla.appendChild(tarjeta(m, null)); });
        return;
      }

      // Vertigo: la cartera con su salud, y la administracion debajo.
      document.getElementById("titulo").textContent = "Cartera";
      sub.textContent = locales.length + " local" + (locales.length === 1 ? "" : "es") + " · administracion de Vertigo Pro";
      admin.hidden = false;
      var m = /^#admin\/(usuarios|locales|gastos)/.exec(location.hash || "");
      if (m) {
        TAB = m[1];
        document.querySelectorAll(".tabs button").forEach(function (x) { x.classList.toggle("activa", x.dataset.tab === TAB); });
      }
      pedir("/api/agencia").then(function (c) {
        var porSlug = {};
        (c.locales || []).forEach(function (x) { porSlug[x.slug] = x; });
        rejilla.innerHTML = "";
        locales.forEach(function (l) { rejilla.appendChild(tarjeta(l, porSlug[l.slug] || null)); });
        if (!locales.length) rejilla.innerHTML = '<div class="vacio">Ningun local todavia.</div>';
      }).catch(function () {
        locales.forEach(function (l) { rejilla.appendChild(tarjeta(l, null)); });
      });
      dibujarAdmin();
    })
    .catch(function () {
      rejilla.innerHTML = '<div class="vacio">No se pudo hablar con el servidor. Recarga en unos segundos.</div>';
    });
})();
</script>
</body>
</html>
