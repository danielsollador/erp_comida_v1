<!doctype html>
<html lang="es-VE">
  <head>
    <meta charset="UTF-8" />
    <!-- El icono lo decide el backend segun el local (ver /api/acceso/favicon):
         el mismo paquete sirve a Savora, al proximo local y al hub. -->
    <link rel="icon" href="/api/acceso/favicon" />
    <link rel="apple-touch-icon" href="/api/acceso/favicon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)" />
    <title>Savora · Vertigo Pro</title>
    <!-- Las tres tipografias del sistema: Sora (titulos), Manrope (texto) y
         JetBrains Mono (cifras). Si el local esta sin internet caen a las del
         sistema y el ERP sigue funcionando igual. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- El tema se aplica ANTES de pintar nada. Si lo pusiera React al montar,
         quien usa el modo oscuro veria un destello blanco en cada carga. Misma
         clave que login.html: el tema se elige una vez y vale para todo. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("vertigo_tema");
          if (!t) {
            t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "oscuro" : "claro";
          }
          document.documentElement.dataset.tema = t;
        } catch (e) { document.documentElement.dataset.tema = "claro"; }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
